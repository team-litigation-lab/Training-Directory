<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSH Training Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#262B45;
  --navy-2:#323A5E;
  --navy-3:#1A1E33;
  --orange:#DB8437;
  --orange-2:#C46F27;
  --orange-tint:#FBEADA;
  --paper:#F6F2EA;
  --paper-2:#EFE9DC;
  --ink:#20222E;
  --ink-soft:#5B5F72;
  --line:#E2DACB;
  --white:#FFFFFF;
  --ok:#3E7A5E;
  --shadow: 0 8px 24px -12px rgba(38,43,69,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
}
::selection{background:var(--orange-tint);color:var(--navy-3);}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:var(--navy);
  border-bottom:3px solid var(--orange);
  display:flex; align-items:center; gap:16px;
  padding:10px 22px;
}
.topbar .brand{
  display:flex; align-items:center; gap:12px;
  flex-shrink:0;
}
.topbar .brand img{ height:40px; width:auto; display:block; background:#fff; padding:4px 8px; border-radius:8px; box-sizing:border-box; }   /* the standard LSH logo: the full mark with its wordmark, on white so the navy wordmark reads on the navy bar */
.topbar .divider{ width:1px; height:26px; background:rgba(255,255,255,.18); }
.topbar .title{
  font-family:'Fraunces',serif; font-weight:600; font-size:16px;
  color:var(--white); letter-spacing:.01em;
}
.topbar .subtitle{
  font-size:11.5px; color:rgba(255,255,255,.55); letter-spacing:.04em; text-transform:uppercase;
  margin-top:1px;
}
.topbar .search-wrap{ margin-left:auto; position:relative; width:min(320px,38vw); }
.topbar input[type="search"]{
  width:100%; padding:9px 14px 9px 34px; border-radius:7px; border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.08); color:#fff; font-size:13.5px; font-family:'Inter',sans-serif;
  outline:none; transition:background .15s, border-color .15s;
}
.topbar input[type="search"]::placeholder{ color:rgba(255,255,255,.45); }
.topbar input[type="search"]:focus{ background:rgba(255,255,255,.14); border-color:var(--orange); }
.topbar .search-icon{
  position:absolute; left:11px; top:50%; transform:translateY(-50%);
  width:14px; height:14px; opacity:.55;
}
.menu-btn{
  display:none; background:none; border:none; color:#fff; cursor:pointer; padding:6px;
}

/* ---------- Layout ---------- */
.layout{ display:flex; align-items:flex-start; }

/* ---------- Sidebar: folder tabs ---------- */
.sidebar{
  width:278px; flex-shrink:0;
  min-height:calc(100vh - 58px);
  background:var(--navy-3);
  padding:18px 0 40px;
  position:sticky; top:58px;
  overflow-y:auto;
  max-height:calc(100vh - 58px);
}
.sidebar .eyebrow{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.12em;
  color:var(--orange); text-transform:uppercase; padding:4px 22px 10px;
}
.tab-list{ list-style:none; margin:0; padding:0; }
.tab-item{ position:relative; }
.tab-btn{
  width:100%; text-align:left; background:none; border:none; cursor:pointer;
  color:rgba(255,255,255,.72); font-family:'Inter',sans-serif; font-size:13.6px; font-weight:500;
  padding:10px 22px 10px 26px; display:flex; align-items:center; gap:10px;
  border-left:3px solid transparent;
  transition:background .12s, color .12s, border-color .12s;
  position:relative;
}
.tab-btn:hover{ background:rgba(255,255,255,.05); color:#fff; }
.tab-btn .dot{
  width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.25); flex-shrink:0;
  transition:background .12s;
}
.tab-item.active .tab-btn{
  background:var(--paper); color:var(--navy-3); border-left-color:var(--orange);
  font-weight:600;
  border-top-right-radius: 0;
}
.tab-item.active .tab-btn .dot{ background:var(--orange); }
/* folder-tab notch effect */
.tab-item.active::before{
  content:""; position:absolute; right:0; top:-10px; bottom:-10px; width:10px;
  background:var(--paper);
}
.tab-item.active::after{
  content:""; position:absolute; right:0; top:-10px; height:10px; width:20px;
  background:var(--navy-3); border-bottom-right-radius:10px;
}
.tab-item.active:first-child::after{ display:none; }

/* ---------- Main content ---------- */
.content{
  flex:1; min-width:0;
  padding:34px 42px 90px;
}
.content-inner{ max-width:980px; margin:0 auto; }

.page-head{ margin-bottom:26px; }
.page-head-top{
  display:flex; justify-content:space-between; align-items:flex-end; gap:16px 24px; flex-wrap:wrap;
  margin-bottom:8px;
}
.page-head .kicker{
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--orange-2); margin-bottom:6px;
}
.page-head h1{
  font-family:'Fraunces',serif; font-weight:600; font-size:34px; line-height:1.1; margin:0;
  color:var(--navy-3);
}
.page-head p{ margin:0; color:var(--ink-soft); font-size:14.5px; max-width:62ch; }
.main-drive-btn{
  display:inline-flex; align-items:center; gap:8px; flex-shrink:0;
  padding:11px 18px; border-radius:9px; background:var(--navy); border:1px solid var(--navy);
  color:#fff; font-weight:600; font-size:13.5px; text-decoration:none;
  transition:background .12s, border-color .12s, transform .1s;
  margin-bottom:2px;
}
.main-drive-btn:hover{ background:var(--orange-2); border-color:var(--orange-2); transform:translateY(-1px); }

.restricted-badge{ margin-left:auto; font-size:11px; opacity:.6; flex-shrink:0; }
.restricted-gate{
  border:1.5px dashed var(--line); border-radius:14px; padding:56px 30px; text-align:center;
  margin-top:6px; background:var(--white);
}
.restricted-lock{ font-size:30px; margin-bottom:14px; opacity:.75; }
.restricted-title{
  font-family:'Fraunces',serif; font-weight:600; font-size:20px; color:var(--navy-3); margin-bottom:10px;
}
.restricted-gate p{ color:var(--ink-soft); font-size:14px; max-width:44ch; margin:0 auto 22px; }

/* Sub-section title (used for MEDSUM AND DEMAND variants etc) */
.subsection{
  margin:10px 0 22px;
  padding-bottom:6px;
}
.subsection-title{
  display:flex; align-items:center; gap:10px;
  font-family:'Fraunces',serif; font-weight:600; font-size:19px; color:var(--navy);
  margin:36px 0 14px;
}
.subsection-title:first-child{ margin-top:0; }
.subsection-title .tag{
  font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.06em;
  background:var(--orange-tint); color:var(--orange-2); padding:3px 8px; border-radius:5px;
  text-transform:uppercase;
}
.subsection-title a.folder-link{
  font-family:'Inter',sans-serif; font-weight:500; font-size:12px; color:var(--ink-soft);
  text-decoration:none; border-bottom:1px dotted var(--ink-soft); margin-left:auto;
}
.subsection-title a.folder-link:hover{ color:var(--orange-2); border-color:var(--orange-2); }

/* Day card */
.day-grid{ display:flex; flex-direction:column; gap:10px; }
.day-card{
  background:var(--white); border:1px solid var(--line); border-radius:10px;
  padding:16px 18px; display:flex; gap:16px; align-items:flex-start;
  box-shadow: 0 1px 0 rgba(38,43,69,.02);
}
.day-num{
  flex-shrink:0; width:56px; text-align:center;
  font-family:'IBM Plex Mono',monospace; color:var(--navy); padding-top:2px;
}
.day-num .no{ font-size:9.5px; letter-spacing:.1em; color:var(--ink-soft); display:block; }
.day-num .n{ font-size:19px; font-weight:600; }
.day-body{ flex:1; min-width:0; }
.day-label{ font-size:13px; color:var(--ink-soft); margin:0 0 8px; font-weight:500; display:block; }
.day-label-link{
  display:inline-flex; align-items:center; gap:6px; text-decoration:none;
  color:var(--navy); font-weight:600; border-bottom:1px dashed var(--orange);
  transition:color .12s, border-color .12s;
}
.day-label-link:hover{ color:var(--orange-2); border-color:var(--orange-2); }
.day-label-link .drive-ic{ font-size:11px; opacity:.7; }
.chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{
  display:inline-flex; align-items:center; gap:6px;
  font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:999px;
  text-decoration:none; border:1px solid var(--navy); color:var(--navy);
  background:var(--white); transition:background .12s,color .12s, transform .1s;
  white-space:nowrap;
}
.chip:hover{ background:var(--navy); color:#fff; transform:translateY(-1px); }
.chip.solid{ background:var(--orange); border-color:var(--orange); color:#fff; }
.chip.solid:hover{ background:var(--orange-2); border-color:var(--orange-2); }
.chip.disabled{
  border-style:dashed; border-color:var(--line); color:var(--ink-soft); opacity:.7; cursor:default; background:transparent;
}
.chip.disabled:hover{ background:transparent; color:var(--ink-soft); transform:none; }
.chip .ic{ width:12px; height:12px; flex-shrink:0; }
.extra-row{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
.extra-row .extra-label{
  font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-soft); margin-bottom:7px;
}

/* Trailing / resource list */
.res-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px;
  margin-top:8px;
}
.res-card{
  display:flex; align-items:center; gap:10px;
  background:var(--white); border:1px solid var(--line); border-radius:9px;
  padding:11px 13px; text-decoration:none; color:var(--ink); font-size:13px; font-weight:500;
  transition:border-color .12s, box-shadow .12s, transform .1s;
}
.res-card:hover{ border-color:var(--orange); box-shadow:var(--shadow); transform:translateY(-1px); }
.res-card .swatch{
  width:26px;height:26px;border-radius:7px;background:var(--orange-tint);color:var(--orange-2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:700;
  font-family:'IBM Plex Mono',monospace;
}
.res-card.no-link{
  border-style:dashed; border-color:var(--line); color:var(--ink-soft); opacity:.7; cursor:default;
  background:transparent;
}
.res-card.no-link:hover{ border-color:var(--line); box-shadow:none; transform:none; }
.res-card.no-link .swatch{
  background:transparent; border:1.5px dashed var(--line); color:var(--ink-soft); font-weight:600;
}

.stack-label{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-soft); margin:26px 0 10px;
}

/* Empty state */
.empty-state{
  border:1.5px dashed var(--line); border-radius:12px; padding:46px 30px; text-align:center;
  color:var(--ink-soft); margin-top:10px;
}
.empty-state .stamp{
  display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em;
  border:1.5px solid var(--ink-soft); color:var(--ink-soft); padding:6px 14px; border-radius:5px;
  transform:rotate(-3deg); text-transform:uppercase; margin-bottom:14px; opacity:.7;
}
.empty-state p{ margin:0; font-size:14px; }

footer.page-footer{
  text-align:center; padding:26px 20px 40px; color:var(--ink-soft); font-size:12px;
}

/* Mobile */
@media (max-width:860px){
  .menu-btn{ display:inline-flex; }
  .topbar .search-wrap{ width:auto; flex:1; margin-left:10px; }
  .topbar .title, .topbar .subtitle{ display:none; }
  .sidebar{
    position:fixed; left:0; top:58px; bottom:0; z-index:50;
    transform:translateX(-100%); transition:transform .2s ease;
    width:82vw; max-width:320px; box-shadow: 12px 0 30px rgba(0,0,0,.25);
  }
  .sidebar.open{ transform:translateX(0); }
  .content{ padding:24px 18px 70px; }
  .page-head h1{ font-size:26px; }
  .day-card{ flex-direction:column; }
  .day-num{ flex-direction:row; width:auto; display:flex; align-items:baseline; gap:6px; }
  .overlay{
    display:none; position:fixed; inset:0; top:58px; background:rgba(20,22,30,.4); z-index:45;
  }
  .overlay.show{ display:block; }
}
</style>
</head>

raining Interface", "link": "https://team-litigation-lab.github.io/CaseManagementTraining/"}]}, "OTHER RESOURCES": {"sections": [], "notes": []}}}</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('site-data').textContent);

  const ICONS = {
    'video': '&#9654;', 'videos': '&#9654;', 'topic': '&#9654;',
    'canva links': '&#127912;',
    'sop': '&#128220;',
    'activity': '&#9998;',
    'answer key': '&#128273;',
    'training materials': '&#128218;',
  };
  function iconFor(label) {
    const key = label.toLowerCase().replace(/\s*\d+$/, '').trim();
    return ICONS[key] || '&#128279;';
  }

  const tabList = document.getElementById('tabList');
  const contentInner = document.getElementById('contentInner');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const menuBtn = document.getElementById('menuBtn');
  const searchInput = document.getElementById('searchInput');

  let activeKey = DATA.topics[0].key;

  function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }

  function buildTabs() {
    tabList.innerHTML = '';
    DATA.topics.forEach(t => {
      const li = document.createElement('li');
      li.className = 'tab-item';
      li.dataset.key = t.key;
      const btn = document.createElement('button');
      btn.className = 'tab-btn';
      const lockBadge = t.key === 'TRAINING TOOLS AND RESOURCES' ? '<span class="restricted-badge" title="Training Team only">&#128274;</span>' : '';
      btn.innerHTML = `<span class="dot"></span>${t.name}${lockBadge}`;
      btn.addEventListener('click', () => selectTopic(t.key));
      li.appendChild(btn);
      tabList.appendChild(li);
    });
    updateActiveTab();
  }

  function updateActiveTab() {
    [...tabList.children].forEach(li => {
      li.classList.toggle('active', li.dataset.key === activeKey);
    });
  }

  function chipHTML(label, val, link, solid) {
    if (!link) {
      return `<span class="chip disabled" title="No link on file">
        <span class="ic">${iconFor(label)}</span>${label}</span>`;
    }
    return `<a class="chip${solid ? ' solid' : ''}" href="${escapeAttr(link)}" title="${escapeAttr(link)}" target="_blank" rel="noopener">
      <span class="ic">${iconFor(label)}</span>${label}</a>`;
  }

  function escapeAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
  }
  function escapeHTML(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function dayNumberOf(label, idx) {
    const m = /(\d+)/.exec(label || '');
    return m ? m[1].padStart(2, '0') : String(idx + 1).padStart(2, '0');
  }

  function renderRow(row, idx) {
    const num = dayNumberOf(row.label, idx);
    const entries = Object.entries(row.cells);
    // The first column (Topic/Video) represents the link to the Main Drive folder
    // for this topic — attach it to the topic label itself instead of a separate chip.
    const mainIdx = entries.findIndex(([label]) => /^topic(\s\d+)?$/i.test(label));
    let mainLink = null;
    let restEntries = entries;
    if (mainIdx !== -1) {
      mainLink = entries[mainIdx][1].link || null;
      restEntries = entries.filter((_, i) => i !== mainIdx);
    }
    const cellsHTML = restEntries.map(([label, c]) => chipHTML(label, c.val, c.link)).join('');
    let extraHTML = '';
    if (row.extra && row.extra.length) {
      extraHTML = `<div class="extra-row"><div class="extra-label">Additional resource</div>
        <div class="chip-row">${row.extra.map(e => chipHTML(e.val || 'Resource', e.val, e.link, true)).join('')}</div></div>`;
    }
    const labelText = escapeHTML(row.label || '');
    const labelHTML = mainLink
      ? `<a class="day-label day-label-link" href="${escapeAttr(mainLink)}" title="Open in Main Drive" target="_blank" rel="noopener">${labelText} <span class="drive-ic">&#128193;</span></a>`
      : `<p class="day-label">${labelText}</p>`;
    return `<div class="day-card">
      <div class="day-num"><span class="no">No.</span><span class="n">${num}</span></div>
      <div class="day-body">
        ${labelHTML}
        <div class="chip-row">${cellsHTML}</div>
        ${extraHTML}
      </div>
    </div>`;
  }

  function renderSection(section) {
    let html = '';
    if (section.title) {
      html += `<div class="subsection-title">${escapeHTML(section.title)}`;
      if (section.title_link) {
        html += `<a class="folder-link" href="${escapeAttr(section.title_link)}" title="${escapeAttr(section.title_link)}" target="_blank" rel="noopener">Open source folder &rarr;</a>`;
      }
      html += `</div>`;
    }
    if (section.rows && section.rows.length) {
      html += `<div class="day-grid">${section.rows.map(renderRow).join('')}</div>`;
    }
    if (section.trailing_links && section.trailing_links.length) {
      html += `<div class="stack-label">Additional resources</div>
        <div class="res-grid">${section.trailing_links.map(l => resCard(l)).join('')}</div>`;
    }
    return html;
  }

  function resCard(l) {
    if (!l.link) {
      return `<span class="res-card no-link" title="No link on file">
        <span class="swatch">&mdash;</span>${escapeHTML(l.label || '')}</span>`;
    }
    const initials = (l.label || '?').trim().slice(0, 2).toUpperCase();
    return `<a class="res-card" href="${escapeAttr(l.link)}" title="${escapeAttr(l.link)}" target="_blank" rel="noopener">
      <span class="swatch">${escapeHTML(initials)}</span>${escapeHTML(l.label || 'Resource')}</a>`;
  }

  function extractMainFolderLink(sheet, topicName) {
    const target = topicName.trim().toLowerCase();
    for (const s of (sheet.sections || [])) {
      if (!s.trailing_links) continue;
      const idx = s.trailing_links.findIndex(l => l.label && l.link && l.label.trim().toLowerCase() === target);
      if (idx !== -1) return s.trailing_links.splice(idx, 1)[0];
    }
    if (sheet.notes) {
      const idx = sheet.notes.findIndex(l => l.label && l.link && l.label.trim().toLowerCase() === target);
      if (idx !== -1) return sheet.notes.splice(idx, 1)[0];
    }
    return null;
  }

  const mainFolderCache = {};
  function renderTopic(key) {
    const topic = DATA.topics.find(t => t.key === key);
    const sheet = DATA.sheets[key];
    if (!(key in mainFolderCache)) {
      mainFolderCache[key] = extractMainFolderLink(sheet, topic.name);
    }
    const mainFolder = mainFolderCache[key];
    const driveBtn = mainFolder
      ? `<a class="main-drive-btn" href="${escapeAttr(mainFolder.link)}" title="${escapeAttr(mainFolder.link)}" target="_blank" rel="noopener">
          <span>&#128193;</span> Open in Main Drive</a>`
      : '';
    let html = `<div class="page-head">
      <div class="page-head-top">
        <div>
          <div class="kicker">Training Directory</div>
          <h1>${escapeHTML(topic.name)}</h1>
        </div>
        ${driveBtn}
      </div>
    </div>`;

    const RESTRICTED_KEY = 'TRAINING TOOLS AND RESOURCES';
    if (key === RESTRICTED_KEY && sessionStorage.getItem('lsh_unlocked_tools') !== '1') {
      html += `<div class="restricted-gate">
        <div class="restricted-lock">&#128274;</div>
        <div class="restricted-title">Restricted — Training Team Only</div>
        <p>This folder contains internal tools and templates limited to the Training &amp; Development team.</p>
        <button class="main-drive-btn" id="unlockToolsBtn" type="button">I'm on the Training Team — Continue</button>
      </div>`;
      contentInner.innerHTML = html;
      const btn = document.getElementById('unlockToolsBtn');
      if (btn) btn.addEventListener('click', () => {
        sessionStorage.setItem('lsh_unlocked_tools', '1');
        renderTopic(key);
      });
      contentInner.scrollTop = 0;
      window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
      return;
    }

    const hasSections = sheet.sections && sheet.sections.length;
    const hasNotes = sheet.notes && sheet.notes.length;

    if (!hasSections && !hasNotes) {
      html += `<div class="empty-state">
        <div class="stamp">Not yet filed</div>
        <p>No materials have been added to this folder yet. Check back soon.</p>
      </div>`;
    } else {
      if (hasSections) {
        html += sheet.sections.map(renderSection).join('');
      }
      if (hasNotes) {
        html += `<div class="stack-label">${hasSections ? 'More resources' : 'Resources'}</div>
          <div class="res-grid">${sheet.notes.map(resCard).join('')}</div>`;
      }
    }
    contentInner.innerHTML = html;
    contentInner.scrollTop = 0;
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }

  function selectTopic(key) {
    activeKey = key;
    updateActiveTab();
    renderTopic(key);
    closeSidebar();
    searchInput.value = '';
  }

  function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('show'); }
  function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('show'); }
  menuBtn.addEventListener('click', () => {
    sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
  });
  overlay.addEventListener('click', closeSidebar);

  // ---- Search ----
  function buildSearchIndex() {
    const index = [];
    DATA.topics.forEach(t => {
      const sheet = DATA.sheets[t.key];
      (sheet.sections || []).forEach(s => {
        (s.rows || []).forEach(r => {
          index.push({ topicKey: t.key, topicName: t.name, label: `${s.title ? s.title + ' — ' : ''}${r.label}`, kind: 'day' });
        });
      });
    });
    return index;
  }
  const searchIndex = buildSearchIndex();
  let searchBox = null;

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) { removeSearchBox(); return; }
    const topicMatches = DATA.topics.filter(t => t.name.toLowerCase().includes(q));
    const rowMatches = searchIndex.filter(r => r.label.toLowerCase().includes(q) || r.topicName.toLowerCase().includes(q)).slice(0, 20);
    showSearchResults(topicMatches, rowMatches, q);
  });

  function removeSearchBox() {
    if (searchBox) { searchBox.remove(); searchBox = null; }
  }

  function showSearchResults(topicMatches, rowMatches, q) {
    removeSearchBox();
    searchBox = document.createElement('div');
    searchBox.style.cssText = `position:absolute; top:52px; right:22px; width:min(360px,90vw); max-height:70vh; overflow-y:auto;
      background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); z-index:60; padding:8px;`;
    let html = '';
    if (!topicMatches.length && !rowMatches.length) {
      html = `<div style="padding:16px; color:var(--ink-soft); font-size:13px;">No matches for "${escapeHTML(q)}"</div>`;
    } else {
      if (topicMatches.length) {
        html += `<div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding:8px 10px 4px;">Topics</div>`;
        topicMatches.forEach(t => {
          html += `<div class="search-result" data-key="${t.key}" style="padding:9px 10px;border-radius:7px;cursor:pointer;font-size:13.5px;font-weight:500;">${escapeHTML(t.name)}</div>`;
        });
      }
      if (rowMatches.length) {
        html += `<div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding:8px 10px 4px;">Training days</div>`;
        rowMatches.forEach(r => {
          html += `<div class="search-result" data-key="${r.topicKey}" style="padding:9px 10px;border-radius:7px;cursor:pointer;font-size:13px;">
            <div style="font-weight:500;">${escapeHTML(r.label)}</div>
            <div style="color:var(--ink-soft);font-size:11.5px;">${escapeHTML(r.topicName)}</div></div>`;
        });
      }
    }
    searchBox.innerHTML = html;
    document.querySelector('.topbar').style.position = 'sticky';
    document.querySelector('.topbar').appendChild(searchBox);
    searchBox.querySelectorAll('.search-result').forEach(el => {
      el.addEventListener('mouseenter', () => el.style.background = 'var(--paper-2)');
      el.addEventListener('mouseleave', () => el.style.background = 'transparent');
      el.addEventListener('click', () => {
        selectTopic(el.dataset.key);
        removeSearchBox();
      });
    });
  }
  document.addEventListener('click', (e) => {
    if (searchBox && !searchBox.contains(e.target) && e.target !== searchInput) removeSearchBox();
  });

  buildTabs();
  renderTopic(activeKey);
})();

</script>
</body>
</html>
